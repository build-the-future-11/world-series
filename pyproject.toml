[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-series"
version = "0.1.0"
description = "World Series v0.1 research workbench — nine independently testable modules"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan" }]
urls = { Homepage = "https://github.com/build-the-future-11/world-series", "Bug Tracker" = "https://github.com/build-the-future-11/world-series/issues" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
]

[project.scripts]
world-series = "world_series.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
